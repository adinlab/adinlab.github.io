name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script for all active members
        id: run_citation_update
        shell: bash
        run: |
          echo "🚀 Screening Scholar profiles of active faculty/researchers, refreshing citation counts, and adding any missing recent publications (with retries)..."
          start_time=$(date)
          status=1
          for attempt in 1 2 3 4 5; do
            echo "▶️ Attempt $attempt..."
            timeout 900 python bin/update_scholar_citations.py
            status=$?
            if [ $status -eq 0 ]; then
              break
            fi
            echo "⚠️ Attempt $attempt failed (exit code $status). Retrying in 60s..."
            sleep 60
          done
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Citation update script failed after 5 attempts (exit code $status)."
            echo "❌ Citation update script failed after 5 attempts (exit code $status)." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Promote arXiv-only entries once Scholar shows a real venue
        id: run_venue_update
        shell: bash
        run: |
          echo "🚀 Checking arXiv-only bibliography entries against refreshed Scholar data..."
          start_time=$(date)
          timeout 120 python bin/update_publication_venues.py
          status=$?
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "✅ Venue update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Venue update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Venue update script failed with exit code $status."
            echo "❌ Venue update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        run: |
          git add _data/citations.yml _bibliography/papers.bib
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations, publications, and venues for active team members"
            git pull --rebase
            git push
          )
