<p> </p>
<div class="team-member text-center">
    {% if include.member.image %}
        <img src="{{ include.member.image | relative_url}}" class="card-img img-fluid z-depth-1 rounded-circle team-photo" alt="{{ include.member.name }}">
    {% else %}
        <img src="{{ '/assets/img/team/default.png' | relative_url }}" class="card-img img-fluid z-depth-1 rounded-circle team-photo" alt="{{ include.member.name }}">
    {% endif %}
    {% if include.member.webpage %}
        <h5 class="card-title team-name"><a href="{{ include.member.webpage }}" target="_blank" rel="noopener noreferrer">{{ include.member.name }}</a></h5>
    {% elsif include.member.scholar %}
        <h5 class="card-title team-name"><a href="{{ include.member.scholar }}" target="_blank" rel="noopener noreferrer">{{ include.member.name }}</a></h5>
    {% else %}
        <h5 class="card-title team-name">{{ include.member.name }}</h5>
    {% endif %}
    <p class="card-text team-role">{{ include.member.research_areas }}</p>
</div>
